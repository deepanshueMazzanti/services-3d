<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eMazzanti services, live in one office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#060c18; --panel:rgba(10,20,40,.82); --panel-solid:#0b1730; --line:#1d3358; --text:#dce8ff; --muted:#8aa0c6;
  --protect:#ffb547; --backup:#3df5a8; --manage:#38d6ff; --cloud:#a58bff; --threat:#ff4d6d; --focus:#ffffff;
  color-scheme: dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* This piece is intentionally dark in both themes: it is a lit "control room" view. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#060c18; --text:#dce8ff; } }
:root[data-theme="dark"]{ --ink:#060c18; --text:#dce8ff; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; height:100%; background:var(--ink); color:var(--text); font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.45; overflow:hidden}
#stage{position:fixed; inset:0}
#stage canvas{display:block}
.lbl{font-family:"Chakra Petch","Barlow",sans-serif; font-size:12px; font-weight:600; color:var(--text); padding:2px 8px; border-radius:3px; background:rgba(6,12,24,.6); border:1px solid rgba(56,214,255,.25); white-space:nowrap; pointer-events:none; letter-spacing:.02em}
.lbl.small{font-size:11px; opacity:.85}
.lbl.threat{border-color:rgba(255,77,109,.5); color:#ffb3c0}

header{position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:16px; right:16px; display:flex; align-items:center; gap:16px; z-index:5; pointer-events:none}
.brand{pointer-events:auto}
.brand h1{font-family:"Chakra Petch",sans-serif; font-weight:700; font-size:22px; line-height:1.1; margin:0; letter-spacing:.01em}
.brand p{margin:2px 0 0; color:var(--muted); font-size:13px}
.modes{margin-left:auto; display:flex; gap:2px; padding:3px; background:var(--panel); border:1px solid var(--line); border-radius:8px; pointer-events:auto; backdrop-filter:blur(8px)}
.modes button{font:600 13px "Chakra Petch",sans-serif; color:var(--muted); background:none; border:0; padding:7px 12px; border-radius:6px; cursor:pointer}
.modes button[aria-pressed="true"]{background:#16294d; color:var(--text); box-shadow:inset 0 0 0 1px rgba(56,214,255,.35)}
button:focus-visible{outline:2px solid var(--manage); outline-offset:2px}

#rail{position:fixed; left:16px; top:92px; bottom:calc(env(safe-area-inset-bottom,0px) + 118px); width:250px; overflow:auto; z-index:4; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 8px; backdrop-filter:blur(8px)}
#rail h2{font:600 12px "Chakra Petch",sans-serif; color:var(--muted); margin:12px 8px 4px; letter-spacing:.03em}
#rail h2:first-child{margin-top:2px}
.item{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:0; color:var(--text); font:500 14px "Barlow",sans-serif; padding:7px 8px; border-radius:6px; cursor:pointer}
.item:hover{background:rgba(56,214,255,.07)}
.item[aria-pressed="true"]{background:rgba(56,214,255,.12); box-shadow:inset 2px 0 0 var(--c)}
.item .dot{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 10px var(--c); flex:none}
.item.dim{opacity:.35}
.item small{display:block; color:var(--muted); font-size:12px}

#info{position:fixed; right:16px; top:92px; width:340px; max-height:calc(100% - 220px); overflow:auto; z-index:4; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 18px 14px; backdrop-filter:blur(8px); transform:translateX(0); transition:opacity .25s, transform .25s}
#info.hidden{opacity:0; transform:translateX(16px); pointer-events:none}
#info h3{font:700 21px/1.15 "Chakra Petch",sans-serif; margin:0; color:var(--c,var(--text))}
#info .by{color:var(--muted); font-size:12.5px; margin:4px 0 12px}
#info dl{margin:0}
#info dt{font:600 12.5px "Chakra Petch",sans-serif; color:var(--muted); margin-top:10px}
#info dd{margin:2px 0 0}
#info .pitch{margin-top:14px; padding:10px 12px; border-left:2px solid var(--c,var(--manage)); background:rgba(255,255,255,.03); font-size:14px}
#info .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
#info .chip{font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); color:var(--text)}
#info .close{position:absolute; right:10px; top:10px; background:none; border:0; color:var(--muted); font-size:18px; cursor:pointer; padding:4px 8px}

#strip{position:fixed; left:calc(16px + 250px + 16px); right:16px; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; backdrop-filter:blur(8px); display:grid; grid-template-columns:minmax(170px, 230px) 1fr auto; gap:16px; align-items:center}
#strip.hidden{display:none}
body.playing #strip{bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
#strip .s-name{font:700 17px/1.15 "Chakra Petch",sans-serif; color:var(--c)}
#strip .s-short{color:var(--muted); font-size:13px; margin-top:2px}
#strip ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(var(--n,3), 1fr); gap:10px}
#strip li{display:flex; gap:8px; align-items:flex-start; font-size:13.5px; line-height:1.35; color:var(--muted); transition:color .3s}
#strip li b{flex:none; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font:600 12px "Chakra Petch",sans-serif; border:1px solid var(--line); color:var(--muted); transition:all .3s}
#strip li.on{color:var(--text)}
#strip li.on b{background:var(--c); border-color:var(--c); color:#06101f; box-shadow:0 0 10px var(--c)}
#strip .s-ctrl{display:flex; gap:6px}
#strip button{font:600 13px "Chakra Petch",sans-serif; color:var(--text); background:#132546; border:1px solid var(--line); border-radius:6px; padding:7px 11px; cursor:pointer}
#strip button[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--c); color:var(--c)}
#caption{position:fixed; left:calc(16px + 250px + 16px); right:16px; transform:none; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); width:auto; z-index:5; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; backdrop-filter:blur(8px); display:flex; align-items:center; gap:14px}
#caption.hidden{display:none}
#caption .txt{flex:1}
#caption .ttl{font:600 13px "Chakra Petch",sans-serif; color:var(--muted)}
#caption .line{font-size:16px; margin-top:2px}
#caption .steps{display:flex; gap:4px; margin-top:8px}
#caption .steps i{height:3px; flex:1; background:#1d3358; border-radius:2px}
#caption .steps i.on{background:var(--manage); box-shadow:0 0 6px var(--manage)}
.ctrl{display:flex; gap:6px}
.ctrl button{font:600 13px "Chakra Petch",sans-serif; color:var(--text); background:#132546; border:1px solid var(--line); border-radius:6px; padding:7px 11px; cursor:pointer}
.legend{display:flex; flex-wrap:wrap; gap:4px 12px; margin-bottom:6px; color:var(--text)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:9px; height:9px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c)}
#info ol{margin:6px 0 0; padding-left:20px}
#info ol li{margin:3px 0}
#info ol li::marker{color:var(--c,var(--manage)); font-weight:600}
.hint{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); left:16px; color:var(--muted); font-size:12.5px; z-index:3; max-width:250px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px}

@media (max-width: 860px){
  header{flex-wrap:wrap; gap:8px}
  .brand p{display:none}
  .modes{margin-left:0; width:100%; justify-content:space-between}
  .modes button{flex:1; padding:7px 4px}
  #rail{top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); left:10px; right:10px; width:auto; height:auto; max-height:none; display:flex; overflow-x:auto; overflow-y:hidden; gap:4px; padding:6px}
  #rail h2{display:none}
  .item{width:auto; white-space:nowrap; flex:none}
  .item small{display:none}
  #info{left:10px; right:10px; width:auto; top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 64px); max-height:42%}
  #caption{left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
  #strip{left:10px; right:10px; bottom:calc(env(safe-area-inset-bottom,0px) + 64px); grid-template-columns:1fr auto; gap:8px}
  #strip ol{grid-column:1 / -1; grid-row:2; grid-template-columns:1fr; gap:4px}
  #strip li:not(.on){display:none}
  body.playing #strip{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
  #info{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
  .hint{display:none}
  body.playing #info{display:none}
}
@media (prefers-reduced-motion: reduce){ #info{transition:none} }
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <div class="brand">
    <h1>One office, every eMazzanti service</h1>
    <p>Pick a service to see what it does in a real office</p>
  </div>
  <nav class="modes" aria-label="View">
    <button data-mode="explore" aria-pressed="true">Explore</button>
    <button data-mode="tour" aria-pressed="false">Guided tour</button>
    <button data-mode="story" aria-pressed="false">What if…</button>
    <button data-mode="bundle" aria-pressed="false">e365 bundles</button>
  </nav>
</header>

<aside id="rail" aria-label="Services"></aside>

<section id="info" class="hidden" aria-live="polite"></section>

<div id="strip" class="hidden" aria-live="polite">
  <div><div class="s-name" id="sName"></div><div class="s-short" id="sShort"></div></div>
  <ol id="sSteps"></ol>
  <div class="s-ctrl"><button id="sDetails" aria-expanded="false">Details</button><button id="sClose" aria-label="Close">×</button></div>
</div>

<div id="caption" class="hidden" aria-live="polite">
  <div class="txt">
    <div class="ttl" id="capTitle"></div>
    <div class="line" id="capLine"></div>
    <div class="steps" id="capSteps"></div>
  </div>
  <div class="ctrl">
    <button id="capPrev" aria-label="Previous">Back</button>
    <button id="capPlay" aria-label="Pause">Pause</button>
    <button id="capNext" aria-label="Next">Next</button>
  </div>
</div>

<div class="hint" id="hint">
  <div class="legend"><span><i style="--c:#ff4d6d"></i>Threat</span><span><i style="--c:#c9d3e6"></i>Not checked yet</span><span><i style="--c:#4d8dff"></i>Checked, safe</span><span><i style="--c:#3df5a8"></i>Protected</span></div>
  Drag to turn the office, scroll or pinch to zoom.
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(() => {
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let detailsOpen = false;   // is the full Details card open (it narrows the free screen area)
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const COL = { protect: 0xffb547, backup: 0x3df5a8, manage: 0x38d6ff, cloud: 0xa58bff, threat: 0xff4d6d, line: 0x38d6ff, grid: 0x0f2a52, white: 0xffffff,
  unchecked: 0xc9d3e6, safe: 0x4d8dff, ok: 0x3df5a8 };
const CSSCOL = { protect: '#ffb547', backup: '#3df5a8', manage: '#38d6ff', cloud: '#a58bff' };

// ---------------------------------------------------------------- renderer, camera, controls
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x060c18, 1);
stage.appendChild(renderer.domElement);
const labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
stage.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060c18, 0.0105);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
const HOME = { pos: V(34, 30, 40), target: V(0, 3, 0) };
camera.position.copy(HOME.pos);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.38; controls.minDistance = 8; controls.maxDistance = 260;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- textures
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const GLOW = glowTexture();
function textTexture(text, color) {
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  const f = '600 44px "Chakra Petch", "Barlow", sans-serif'; g.font = f;
  const w = Math.ceil(g.measureText(text).width) + 40; c.width = w; c.height = 72;
  g.font = f; g.fillStyle = 'rgba(6,12,24,.78)'; g.strokeStyle = color; g.lineWidth = 3;
  roundRect(g, 2, 2, w - 4, 68, 12); g.fill(); g.stroke();
  g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, 20, 38);
  const t = new THREE.CanvasTexture(c); t.userData = { aspect: w / 72 }; return t;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ---------------------------------------------------------------- registry for dimming / highlighting
const REG = {};          // name -> group
const ALL = [];          // every registered group
function register(name, group) { REG[name] = group; ALL.push(group); group.userData.name = name; return group; }
function collectMats(group) {
  const mats = [];
  group.traverse(o => { if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.userData.base === undefined) { m.userData.base = m.opacity; m.userData.color = m.color ? m.color.getHex() : null; } mats.push(m); }); } });
  return mats;
}
function setDim(keepNames) {
  const keep = new Set(keepNames || []);
  ALL.forEach(g => {
    const on = !keepNames || keep.has(g.userData.name);
    collectMats(g).forEach(m => { m.opacity = m.userData.base * (on ? 1 : 0.22); m.transparent = true; });
    g.userData.focus = !!keepNames && keep.has(g.userData.name);
  });
}
function tint(name, color) { const g = REG[name]; if (!g) return; collectMats(g).forEach(m => { if (m.isLineBasicMaterial && m.color) m.color.setHex(color); }); }
function untint(name) { const g = REG[name]; if (!g) return; collectMats(g).forEach(m => { if (m.isLineBasicMaterial && m.color && m.userData.color != null) m.color.setHex(m.userData.color); }); }

// ---------------------------------------------------------------- building blocks
function holoBox(w, h, d, color, fill = 0.07, edge = 0.9) {
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: fill, depthWrite: false }));
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color, transparent: true, opacity: edge }));
  g.add(mesh, lines); return g;
}
function holoShape(geo, color, fill = 0.06, edge = 0.85) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: fill, depthWrite: false })));
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 20), new THREE.LineBasicMaterial({ color, transparent: true, opacity: edge })));
  return g;
}
function wire(geo, color, opacity = 0.5) { return new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color, transparent: true, opacity })); }
function label(text, pos, cls = '') {
  const el = document.createElement('div'); el.className = 'lbl ' + cls; el.textContent = text;
  const o = new THREE.CSS2DObject(el); o.position.copy(pos); scene.add(o); return o;
}
function glowDot(color, size = 1) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.setScalar(size); return s; }
function line(points, color, opacity = 0.35) { const g = new THREE.BufferGeometry().setFromPoints(points); return new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity })); }

// ---------------------------------------------------------------- the world
const grid = new THREE.GridHelper(220, 110, COL.grid, COL.grid); grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

// office floor + walls
const office = register('office', new THREE.Group());
office.add(holoBox(26, 0.2, 18, COL.line, 0.05, 0.6).translateY(-0.1));
const wallPts = [V(-13, 0, -9), V(13, 0, -9), V(13, 0, 9), V(-13, 0, 9), V(-13, 0, -9)];
for (let i = 0; i < 4; i++) {
  const a = wallPts[i], b = wallPts[i + 1];
  const top = [a.clone().setY(3.2), b.clone().setY(3.2)];
  office.add(line([a, b], COL.line, 0.5), line(top, COL.line, 0.3), line([a, top[0]], COL.line, 0.35));
}
scene.add(office);
label('Your office', V(-12, 3.9, -9), 'small');

// server room
const rack = register('server', holoBox(1.3, 3.2, 1.1, COL.manage, 0.08)); rack.position.set(10.6, 1.6, -7); scene.add(rack);
for (let i = 0; i < 6; i++) { const led = glowDot(i % 2 ? COL.backup : COL.manage, 0.35); led.position.set(10.6 - 0.45, 0.5 + i * 0.45, -6.42); rack.parent.add(led); rack.userData.leds = (rack.userData.leds || []).concat(led); }
const sw = register('switch', holoBox(1.4, 0.18, 0.9, COL.manage, 0.12)); sw.position.set(10.6, 3.35, -7); scene.add(sw);
const bdr = register('bdr', holoBox(0.9, 0.9, 1.1, COL.backup, 0.12)); bdr.position.set(8.6, 0.45, -7); scene.add(bdr);
label('Server room', V(9.6, 4.2, -7), 'small');

// firewall at the internet line
const fw = register('firewall', holoBox(1.4, 0.55, 1, COL.protect, 0.14)); fw.position.set(-11.6, 1.1, 0.5); scene.add(fw);
label('Firewall', V(-11.6, 1.9, 0.5), 'small');

// meeting room (Teams)
const meet = register('meeting', new THREE.Group());
meet.add(holoBox(3.4, 0.12, 1.6, COL.cloud, 0.08).translateY(0.9));
const screen = holoBox(2.6, 1.4, 0.06, COL.cloud, 0.18); screen.position.set(0, 2, -1.3); meet.add(screen);
meet.position.set(-8.5, 0, -6.2); scene.add(meet);
label('Meeting room', V(-8.5, 3.4, -6.2), 'small');

// printer + reception
const printer = register('printer', holoBox(1.1, 0.9, 0.8, COL.manage, 0.12)); printer.position.set(-6.5, 0.45, 7.3); scene.add(printer);
label('Printer', V(-6.5, 1.5, 7.3), 'small');
const reception = holoBox(3, 1, 1, COL.line, 0.05, 0.45); reception.position.set(-10, 0.5, 6.5); scene.add(reception);

// Wi-Fi access points on the ceiling
const APS = [];
[[-4.5, -1], [3.5, -1], [6.5, 5]].forEach(([x, z], i) => {
  const ap = register('ap' + i, holoShape(new THREE.CylinderGeometry(0.7, 0.7, 0.16, 28), COL.manage, 0.35));
  const g = glowDot(COL.manage, 2.4); g.material.opacity = 0.45; ap.add(g);
  ap.position.set(x, 3.05, z); scene.add(ap); APS.push(ap);
  label('Wi-Fi access point', V(x, 3.75, z), 'small');
  scene.add(line([V(10.6, 3.35, -7), V(10.6, 3.2, z), V(x, 3.2, z)], 0x284a7e, 0.45));
});

// desks, devices and people
const DEVICES = [];
function person(x, z, color = COL.line) {
  const g = new THREE.Group();
  g.add(holoShape(new THREE.CylinderGeometry(0.28, 0.34, 1.1, 12), color, 0.08, 0.6).translateY(0.55));
  g.add(holoShape(new THREE.SphereGeometry(0.24, 12, 8), color, 0.1, 0.6).translateY(1.35));
  g.position.set(x, 0, z); scene.add(g); return g;
}
let devN = 0;
function desk(x, z, type, facing = 1) {
  const top = holoBox(2.6, 0.1, 1.2, COL.line, 0.05, 0.45); top.position.set(x, 0.95, z); scene.add(top);
  const name = 'dev' + (devN++);
  const g = register(name, new THREE.Group());
  if (type === 'laptop') {
    g.add(holoBox(0.9, 0.05, 0.6, COL.manage, 0.25).translateY(0.03));

const FX = [];
const sphereGeo = new THREE.SphereGeometry(0.14, 10, 8);
const SPEED = REDUCED ? 0.6 : 1;
function arc(a, b, h) { return new THREE.QuadraticBezierCurve3(a.clone(), a.clone().lerp(b, 0.5).add(V(0, h, 0)), b.clone()); }
function packet(curve, color, opt = {}) {
  const m = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
  if (opt.size) m.scale.setScalar(opt.size);
  m.add(glowDot(color, 1.1));
  scene.add(m);
  const len = curve.getLength(); let t = 0; const sp = (opt.speed || 9) / len;
  FX.push({
    obj: m, update(dt) {
      t += dt * sp * SPEED;
      if (opt.stopAt != null && t >= opt.stopAt) { const p = curve.getPointAt(opt.stopAt); burst(p, COL.threat); if (opt.blockText) tag(p.clone().add(V(0, 1.2, 0)), opt.blockText, '#ff4d6d'); opt.onStop && opt.onStop(p); return false; }
      if (t >= 1) { opt.onEnd && opt.onEnd(curve.getPointAt(1)); return false; }
      m.position.copy(curve.getPointAt(t)); return true;
    }
  });
}
function ring(pos, color, opt = {}) {
  const r0 = opt.r0 ?? 0.3, r1 = opt.r1 ?? 3, dur = opt.dur ?? 1.2;
  const m = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 64), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  if (!opt.vertical) m.rotation.x = -Math.PI / 2;
  m.position.copy(pos); scene.add(m); let t = 0;
  FX.push({ obj: m, update(dt) { t += dt / dur; if (t >= 1) return false; const s = r0 + (r1 - r0) * t; m.scale.setScalar(s); m.material.opacity = 0.9 * (1 - t); return true; } });
}
function burst(pos, color) { ring(pos, color, { r0: 0.2, r1: 1.8, dur: 0.6, vertical: true }); ring(pos, color, { r0: 0.2, r1: 2.2, dur: 0.7 }); }
function tag(pos, text, color = '#3df5a8', dur = 1.8) {
  const tex = textTexture(text, color);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const h = 0.62; s.scale.set(h * tex.userData.aspect, h, 1); s.position.copy(pos); scene.add(s); let t = 0;
  FX.push({ obj: s, update(dt) { t += dt / dur; if (t >= 1) { tex.dispose(); return false; } s.position.y += dt * 0.5; s.material.opacity = t < 0.15 ? t / 0.15 : 1 - Math.max(0, (t - 0.6) / 0.4); return true; } });
}
function flash(name, color, dur = 1.6) { tint(name, color); later(() => untint(name), dur * 1000); }
function devAt(pos) { return DEVICES.find(d => d.pos.distanceTo(pos) < 0.5); }
function hit(target, text, color = COL.ok) {
  const d = target && target.group ? target : devAt(target); const pos = d ? d.pos : target;
  if (d) flash(d.name, color, 0.9);
  ring(pos.clone().setY(Math.max(0.15, pos.y - 0.45)), color, { r0: 0.3, r1: 1.8, dur: 0.9 });
  if (text) tag(top(pos, 1.3), text, '#' + new THREE.Color(color).getHexString());
}
function scan(name, pos) { if (name) flash(name, COL.safe, 0.5); ring(pos, COL.safe, { r0: 0.3, r1: 2.2, dur: 0.7, vertical: true }); }
// a message that is checked at a checkpoint: threats stop there, the rest turn blue and carry on
function checked(a, b, isBad, opt) {
  packet(arc(a, b, opt.h1 ?? 3), isBad ? COL.threat : COL.unchecked, isBad
    ? { stopAt: 0.96, blockText: opt.blockText, speed: opt.speed }
    : { speed: opt.speed, onEnd: p => { scan(opt.node, p); opt.next && opt.next(p); } });
}
// office traffic follows the real network: laptop -> Wi-Fi access point -> switch -> firewall,
// desktops, printer and server -> switch (cable) -> firewall. The remote worker goes straight out from home.
const FWP = V(-11.6, 1.2, 0.5), SWP = V(10.6, 3.35, -7);
function nearestAP(pos) { return APS.reduce((b, a) => a.position.distanceTo(pos) < b.position.distanceTo(pos) ? a : b); }
function hopsToFirewall(d) {          // list of [point, node name] from the device out to the firewall
  const h = [];
  if (d.type === 'laptop') { const ap = nearestAP(d.pos); h.push([ap.position.clone(), ap.userData.name]); }
  h.push([SWP.clone(), 'switch'], [FWP.clone(), 'firewall']);

}
function chain(start, hops, color, opt, done) {   // move a packet hop by hop, lighting each box it passes
  if (!hops.length) { done && done(start); return; }
  const [pt, node] = hops[0];
  packet(arc(start, pt, start.distanceTo(pt) > 8 ? 1.4 : 0.5), color, { speed: Math.max(14, opt.speed || 0), size: opt.size, onEnd: () => { if (node) flash(node, COL.safe, 0.3); chain(pt, hops.slice(1), color, opt, done); } });
}
function outFrom(d, dest, h, color, opt = {}) {

function inTo(src, d, h, color, opt = {}) {

  packet(arc(src, FWP, h), color, { speed: opt.speed, size: opt.size, onEnd: () => { flash('firewall', COL.safe, 0.3); chain(FWP.clone(), back, color, opt, () => opt.onEnd && opt.onEnd(d.pos)); } });

// ---------------------------------------------------------------- camera moves
// share of the screen not covered by the side panels (desktop) or the bottom sheet (phone)
function freeArea() {
  if (innerWidth > 860) return { w: Math.max(0.45, (innerWidth - 266 - (detailsOpen ? 356 : 0)) / innerWidth), h: Math.max(0.5, (innerHeight - 92 - 120) / innerHeight) };
  return { w: 1, h: 0.5 };
}
function fitView(pts) {
  // place the camera on a fixed diagonal and move it in or out until every flow point sits inside the free part of the screen
  const center = new THREE.Box3().setFromPoints(pts).getCenter(new THREE.Vector3());
  const free = freeArea(), dir = V(0.52, 0.5, 0.69).normalize();
  const cam = camera.clone(); let dist = 60;
  for (let i = 0; i < 6; i++) {
    cam.position.copy(center).addScaledVector(dir, dist); cam.lookAt(center); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    let need = 0;
    pts.forEach(p => { const n = p.clone().project(cam); need = Math.max(need, Math.abs(n.x) / (free.w * 0.92), Math.abs(n.y) / (free.h * 0.92)); });
    dist *= Math.min(2.5, Math.max(0.5, need));
  }
  dist = Math.max(16, dist);
  return { pos: center.clone().addScaledVector(dir, dist), target: center };
}
let camAnim = null;
function flyTo(c, dur = 1.4) {
  if (!c) return;
  if (REDUCED) { camera.position.copy(c.pos); controls.target.copy(c.target); return; }
  camAnim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: c.pos.clone(), t1: c.target.clone(), t: 0, dur };
}

    b.setAttribute('aria-pressed', String(activeId === it.id));

    b.addEventListener('click', () => onPick(it.id)); rail.appendChild(b);
  });
}
// bottom strip: what the service does, step by step, with a Details button for the full card
const strip = document.getElementById('strip'), sDetails = document.getElementById('sDetails');
let detailsFn = null, stripTimer = null;
function showStrip(o) {
  strip.style.setProperty('--c', o.color); strip.classList.remove('hidden');
  document.getElementById('sName').textContent = o.name; document.getElementById('sShort').textContent = o.short;
  const ol = document.getElementById('sSteps'); ol.style.setProperty('--n', o.steps.length);
  ol.innerHTML = o.steps.map((t, i) => `<li><b>${i + 1}</b><span>${t}</span></li>`).join('');
  detailsFn = o.details; setDetails(detailsOpen);
  clearInterval(stripTimer); let k = 0; const lis = [...ol.children];
  const light = () => { lis.forEach((li, i) => li.classList.toggle('on', o.cycle ? i === k % lis.length : true)); k++; };
  light(); if (o.cycle) stripTimer = setInterval(light, 2600);
}
function hideStrip() { clearInterval(stripTimer); strip.classList.add('hidden'); info.classList.add('hidden'); detailsFn = null; detailsOpen = false; sDetails.setAttribute('aria-expanded', 'false'); }
function setDetails(open) {
  detailsOpen = open; sDetails.setAttribute('aria-expanded', String(open));
  if (open && detailsFn) detailsFn(); else info.classList.add('hidden');
}
sDetails.addEventListener('click', () => setDetails(!detailsOpen));
document.getElementById('sClose').addEventListener('click', () => { if (mode === 'explore') selectService(null); else setMode('explore'); });

function showInfo(s) {
  info.style.setProperty('--c', CSSCOL[s.g]);
  const inBundles = BUNDLES.filter(b => b.ids.includes(s.id)).map(b => b.name);
  info.innerHTML = `<button class="close" aria-label="Close">×</button>
    <h3>${s.name}</h3><div class="by">${s.short}</div>
    <dl><dt>How it works</dt><dd><ol>${s.flow.map(f => `<li>${f}</li>`).join('')}</ol></dd>
    <dt>What it is</dt><dd>${s.what}</dd><dt>What the customer gets</dt><dd>${s.gets}</dd><dt>Problem it solves</dt><dd>${s.solves}</dd>
    ${inBundles.length ? `<dt>Included in</dt><dd><div class="chips">${inBundles.map(n => `<span class="chip">${n}</span>`).join('')}</div></dd>` : ''}</dl>
    <div class="pitch">${s.pitch}</div>`;
  info.classList.remove('hidden');
  info.querySelector('.close').addEventListener('click', () => setDetails(false));
}
function selectService(id, opts = {}) {
  stopAll(); current = id;
  if (!id) { hideStrip(); setDim(null); flyTo(HOME); if (mode === 'explore') renderServicesRail(); return; }
  const s = byId[id];
  s.objs.forEach(n => { const g = REG[n]; if (g && n !== 'office') addHalo(g.position.clone().add(V(0, 0.4, 0)), COL[s.g], n === 'internet' || n === 'soc' ? 9 : 6); });
  setDim(s.objs.concat(id === 'network' || id === 'helpdesk' || id === 'sat' || id === 'm365' || id === 'esignit' || id === 'secureroute' || id === 'print' || id === 'soc' ? DEVICES.map(d => d.name) : []).concat(['office']));
  if (opts.fly !== false) flyTo(s.cam);
  s.run();
  if (mode !== 'story') showStrip({ name: s.name, short: s.short, color: CSSCOL[s.g], steps: s.flow, cycle: true, details: () => showInfo(s) });
  if (mode === 'explore') renderServicesRail();
}

// tour and stories share the caption player
let player = null;
function startPlayer(title, steps, onStep, loop = false) {
  stopPlayer(); cap.classList.remove('hidden'); document.body.classList.add('playing');
  player = { i: -1, steps, onStep, title, playing: true, loop, timer: null };
  capSteps.innerHTML = steps.map(() => '<i></i>').join('');
  go(0);
}
function go(i) {
  if (!player) return;
  if (i >= player.steps.length) { if (player.loop) i = 0; else { player.playing = false; document.getElementById('capPlay').textContent = 'Replay'; return; } }
  if (i < 0) i = 0;
  player.i = i; const st = player.steps[i];
  capTitle.textContent = player.title(i); capLine.textContent = st.line;
  [...capSteps.children].forEach((el, k) => el.classList.toggle('on', k <= i));
  player.onStep(i);
  clearTimeout(player.timer);
  if (player.playing) player.timer = setTimeout(() => go(player.i + 1), st.ms || 7000);
  document.getElementById('capPlay').textContent = player.playing ? 'Pause' : 'Play';
}
function stopPlayer() { if (player) clearTimeout(player.timer); player = null; cap.classList.add('hidden'); document.body.classList.remove('playing'); }
document.getElementById('capNext').addEventListener('click', () => player && go(player.i + 1));
document.getElementById('capPrev').addEventListener('click', () => player && go(player.i - 1));
document.getElementById('capPlay').addEventListener('click', () => {
  if (!player) return;
  if (!player.playing && player.i >= player.steps.length - 1 && !player.loop) { player.playing = true; go(0); return; }
  player.playing = !player.playing; go(player.i);
});

function startTour() {
  const steps = S.map(s => ({ line: s.name, ms: 9000 }));
  renderServicesRail();
  startPlayer(i => `Guided tour, ${i + 1} of ${S.length}`, steps, i => { selectService(S[i].id); renderServicesRail(); }, true);
}
function startStory(id) {
  const st = STORIES.find(x => x.id === id);
  renderList(STORIES.map(x => ({ id: x.id, name: x.name })), startStory, id, 'What if…');
  hideStrip();
  stopAll(); setDim(null);
  startPlayer(i => `${st.name}, step ${i + 1} of ${st.steps.length}`, st.steps.map(s => ({ line: s.t, ms: 6500 })), i => {
    const step = st.steps[i]; flyTo(typeof step.cam === 'function' ? step.cam() : step.cam); step.run();
  });
}
function showBundle(id) {
  const b = BUNDLES.find(x => x.id === id); stopAll();
  renderList(BUNDLES.map(x => ({ id: x.id, name: x.name, sub: `${x.ids.length} services` })), showBundle, id, 'e365 bundles');
  const names = [...new Set(b.ids.flatMap(i => byId[i].objs))].concat(DEVICES.map(d => d.name), ['office']);
  setDim(names); flyTo(HOME);
  [...new Set(b.ids.flatMap(i => byId[i].objs))].forEach(n => { const g = REG[n]; if (g && n !== 'office') addHalo(g.position.clone().add(V(0, 0.4, 0)), COL.manage, 6); });
  b.ids.forEach(i => byId[i].run());
  const card = () => { info.style.setProperty('--c', '#38d6ff');
  info.innerHTML = `<button class="close" aria-label="Close">×</button><h3>${b.name}</h3><div class="by">${b.note}</div>
    <dl><dt>What e365 is</dt><dd>One per-user package with everything an employee needs to work safely in Microsoft 365: their mailbox managed, email filtered, data backed up, a branded signature and their computer looked after.</dd>
    <dt>Why customers choose it</dt><dd>One price per person instead of five separate services. Nothing is forgotten when someone joins, every user is protected the same way, and the bill grows or shrinks with headcount.</dd>
    <dt>Basic or Premium</dt><dd>Both cover the user. Premium adds full management and helpdesk support for the computer or laptop they work on.</dd>
    <dt>Included services</dt><dd><div class="chips">${b.ids.map(i => `<span class="chip">${byId[i].name}</span>`).join('')}</div></dd>
    <dt>Not included, add-ons</dt><dd><div class="chips">${S.filter(s => !b.ids.includes(s.id)).map(s => `<span class="chip">${s.name}</span>`).join('')}</div></dd></dl>
    <div class="pitch">Everything one person needs to work safely, on one line of the invoice.</div>`;
  info.classList.remove('hidden');
  info.querySelector('.close').addEventListener('click', () => setDetails(false)); };
  showStrip({ name: b.name, short: b.note, color: '#38d6ff', steps: b.ids.map(i => byId[i].name), cycle: false, details: card });
}
function setMode(m) {
  mode = m; stopPlayer(); stopAll(); current = null;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  hideStrip();
  if (m === 'explore') { setDim(null); flyTo(HOME); renderServicesRail(); }
  if (m === 'tour') startTour();
  if (m === 'story') { renderList(STORIES.map(x => ({ id: x.id, name: x.name })), startStory, null, 'What if…'); setDim(null); flyTo(HOME); }
  if (m === 'bundle') showBundle('basic');
}
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

// click a device or node in 3D to open the matching service
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const OBJ_TO_SERVICE = { firewall: 'firewall', mailfilter: 'email', webfilter: 'secureroute', soc: 'soc', radar: 'soc', darkweb: 'darkweb', vault: 'cloudbackup', bdr: 'bdr', server: 'bdr', switch: 'wifi', ap0: 'wifi', ap1: 'wifi', ap2: 'wifi', m365: 'm365', meeting: 'm365', azure: 'azure', printer: 'print', supplies: 'print', home: 'secureroute', remotelink: 'firewall' };
DEVICES.forEach(d => OBJ_TO_SERVICE[d.name] = 'network');
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(ALL, true);
  for (const h of hits) { let o = h.object; while (o && !o.userData.name) o = o.parent; const sid = o && OBJ_TO_SERVICE[o.userData.name]; if (sid) { if (mode !== 'explore') setMode('explore'); selectService(sid); break; } }
});

// gentle background life: the remote worker stays connected to the office while nothing is selected
setInterval(() => { if (mode === 'explore' && !current && !document.hidden) remoteSession(); }, 2400);

// ---------------------------------------------------------------- intro and loop
renderServicesRail();
const introStart = performance.now();
if (!REDUCED) { camera.position.set(70, 55, 80); flyTo(HOME, 2.6); }
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  if (camAnim) {
    camAnim.t += dt / camAnim.dur; const k = camAnim.t >= 1 ? 1 : 1 - Math.pow(1 - camAnim.t, 3);
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, k); controls.target.lerpVectors(camAnim.t0, camAnim.t1, k);
    if (camAnim.t >= 1) camAnim = null;
  }
  for (let i = FX.length - 1; i >= 0; i--) { if (!FX[i].update(dt)) { const o = FX[i].obj; scene.remove(o); o.traverse(c => { if (c.geometry && c.geometry !== sphereGeo) c.geometry.dispose(); if (c.material) c.material.dispose(); }); FX.splice(i, 1); } }
  dish.rotation.y += dt * 0.9;
  const pulse = 0.72 + 0.28 * Math.sin(now / 1000 * 4.2);
  ALL.forEach(g => { if (!g.userData.focus || g.userData.name === 'office') return;
    if (!g.userData.lines) { g.userData.lines = []; g.traverse(o => { if (o.isLineSegments || o.isLine) g.userData.lines.push(o.material); }); }
    g.userData.lines.forEach(m => m.opacity = m.userData.base * pulse); });
  HALOS.forEach((h, i) => h.material.opacity = 0.22 + 0.16 * Math.sin(now / 1000 * 3 + i));
  if (!REDUCED) {
    const t = now / 1000;
    (rack.userData.leds || []).forEach((l, i) => l.material.opacity = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.7));
    REG.m365.rotation.y = t * 0.08; REG.vault.rotation.y = -t * 0.1; REG.azure.rotation.y = t * 0.1; internet.rotation.y = t * 0.05; darkweb.rotation.y = t * 0.4;
  }
  controls.update();
  scene.fog.density = 0.63 / Math.max(20, camera.position.distanceTo(controls.target));
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>
